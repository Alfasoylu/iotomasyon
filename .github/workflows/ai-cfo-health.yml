name: AI CFO sağlık alarmı

# AI CFO monitörünün kendisini izler (2026-10-07). /api/cron/ai-cfo-health alarm varsa 503 döner:
#   • son iki koşu üst üste başarısız (failed / invalid_output), ya da
#   • son koşu bütçe/günlük limit ya da girdi token sınırı yüzünden atlandı (ANINDA — tek koşu yeter), ya da
#   • AI açık, eylemlik anomali gönderilmiş ama 24 saattir hiç içgörü yazılmamış.
# 503 → bu iş KIRMIZI → GitHub, zamanlanmış workflow'u son düzenleyen kişiye e-posta gönderir.
# Uç salt-okunurdur: hiçbir şey yazmaz, model çağırmaz.
#
# Gerekli repo secret'ları whatsapp-schedules.yml ile aynı: CRON_SECRET + SITE_BASE_URL (yoksa PDKS_BASE_URL).
# ⚠️ Zamanlanmış workflow yalnız varsayılan dalda (main) çalışır.

on:
  schedule:
    - cron: "25 * * * *" # saat başı +25 dk, UTC
  workflow_dispatch: {}

concurrency:
  group: ai-cfo-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sağlık uç noktasını çağır
        env:
          BASE_URL: ${{ secrets.SITE_BASE_URL || secrets.PDKS_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_BASE_URL/PDKS_BASE_URL veya CRON_SECRET tanımlı değil; atlanıyor."
            exit 0
          fi
          code=$(curl -sS -m 60 -L --location-trusted -o /tmp/out.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL%/}/api/cron/ai-cfo-health")
          echo "HTTP ${code}"
          cat /tmp/out.txt || true
          echo
          if [ "$code" = "503" ]; then echo "::error::AI CFO alarmı — ayrıntı yukarıda"; fi
          test "$code" = "200"
