name: CFO and bank upload validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/cfo-main-session]
permissions:
  contents: read
concurrency:
  group: cfo-readonly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: cfo_workflow_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      AI_CFO_ENABLED: 'false'
      AI_CFO_MONITOR_ENABLED: 'false'
      DATABASE_URL: postgresql://localhost:5432/build_only
      DIRECT_URL: postgresql://localhost:5432/build_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - run: node --conditions=react-server --import tsx __tests__/ai-cfo-reconciliation.test.ts
      - run: node --conditions=react-server --import tsx __tests__/cfo-reader-security.test.ts
      - run: node --import tsx __tests__/fm-canonical-sales.test.ts
      - run: node --import tsx __tests__/fm-memory-schema.test.ts
      - run: node --import tsx __tests__/fm-sales-backfill.test.ts
      - run: node --import tsx __tests__/ai-cfo-acceptance-profile.test.ts
      - run: node --import tsx __tests__/ai-cfo-anomalies.test.ts
      - run: node --import tsx __tests__/ai-cfo-provider.test.ts
      - run: node --import tsx __tests__/cfo-operating-context.test.ts
      - run: node --import tsx __tests__/cfo-workflow.test.ts
      - run: node --import tsx __tests__/cfo-cycle-agenda.test.ts
      - run: node --import tsx __tests__/cfo-import-planner.test.ts
      - run: node --import tsx __tests__/cfo-question-research.test.ts
      - name: Exercise CFO cycle through real Prisma and PostgreSQL
        env:
          DIRECT_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/cfo_workflow_test_ci
          CFO_WORKFLOW_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/cfo_workflow_test_ci
        run: |
          python - <<'PY'
          from pathlib import Path
          # The unrelated embedding column is never read by CFO. Its fixture
          # representation avoids needing the pgvector extension in this service.
          schema = Path('prisma/schema.prisma').read_text()
          Path('/tmp/cfo-workflow-synthetic.prisma').write_text(schema.replace('Unsupported("vector(512)")', 'String'))
          PY
          npx prisma db push --schema /tmp/cfo-workflow-synthetic.prisma
          node --conditions=react-server --import tsx __tests__/cfo-workflow-postgres.test.ts
          node --conditions=react-server --import tsx __tests__/cfo-cost-answer.test.ts
      - run: node --import tsx __tests__/cfo-private-files.test.ts
      - run: npm run check:rbac
      - run: npm run check:entegra
      - run: npm run check:banka
      - run: npm run check:banka:safety
      - run: npm run check:banka:pdf
      - run: npm run check:banka:review
      - run: npx eslint lib/banka components/banka app/api/admin/banka-yukleme __tests__/banka*.test.ts 'app/(app)/admin/banka-yukleme/page.tsx'
      - run: npx eslint lib/cfo-agent app/api/admin/ai-cfo/acceptance app/api/admin/ai-cfo/context app/api/admin/ai-cfo/cycle app/api/cron/cfo-cycle 'app/(app)/cfo/calisan' __tests__/cfo-workflow.test.ts __tests__/cfo-import-planner.test.ts lib/actions/cfo-row-qa.ts lib/actions/cfo-question-actions.ts lib/cfo/row-qa.ts lib/cfo/question*.ts components/cfo/row-qa-panel.tsx 'app/(app)/cfo/sorular/page.tsx' __tests__/cfo-question-research.test.ts 'app/(app)/cfo/kazananlar' __tests__/cfo-private-files.test.ts __tests__/cfo-operating-context.test.ts scripts/cfo-read-context.ts __tests__/ai-cfo*.test.ts 'app/(app)/cfo/page.tsx' 'app/(app)/cfo/calisma-durumu/page.tsx' __tests__/cfo-cost-answer.test.ts
      - name: Generate ephemeral build-only session key
        run: |
          python - <<'PY'
          import os, secrets
          key = secrets.token_hex(32)
          print(f'::add-mask::{key}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'SESSION_SECRET={key}\n')
          PY
      - run: npm run build
      - run: node scripts/check-cfo-acceptance-route.mjs
      - run: node scripts/check-bank-upload-route.mjs
