name: CFO and bank upload validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/cfo-main-session]
permissions:
  contents: read
concurrency:
  group: cfo-readonly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Docker Hub anonim çekme sınırı (toomanyrequests, 2026-10-09) CI'ı test başlamadan düşürdü: aynı resmi imaj ECR Public aynasından
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: cfo_workflow_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      AI_CFO_ENABLED: 'false'
      AI_CFO_MONITOR_ENABLED: 'false'
      DATABASE_URL: postgresql://localhost:5432/build_only
      DIRECT_URL: postgresql://localhost:5432/build_only
    steps:
      - uses: actions/checkout@v4
        with:
          # CFO-GOVERNANCE-DRIFT gerçek main'i (HEAD^1 / origin/main) ve main'deki skoru okur
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - run: node --conditions=react-server --import tsx __tests__/ai-cfo-reconciliation.test.ts
      - run: node --conditions=react-server --import tsx __tests__/cfo-reader-security.test.ts
      - run: node --import tsx __tests__/fm-canonical-sales.test.ts
      - run: node --import tsx __tests__/fm-kdv-haric.test.ts
      - run: node --import tsx __tests__/fm-sales-alfashome.test.ts
      - run: npm run check:alfashome
      - run: node --conditions=react-server --import tsx __tests__/cfo-gtip-tarife.test.ts
      - run: node --conditions=react-server --import tsx __tests__/cfo-cost-derivation.test.ts
      - run: node --conditions=react-server --import tsx __tests__/cfo-tek-nakit-yolu.test.ts
      - run: node --import tsx __tests__/cfo-commission-estimate.test.ts
      - run: node --import tsx __tests__/cfo-kur-tek-kaynak.test.ts
      - run: node --import tsx __tests__/cfo-sanal-stok.test.ts
      - run: node --import tsx __tests__/vercel-crons.test.ts
      - run: node --import tsx __tests__/cfo-page-parity.test.ts
      - run: node --import tsx __tests__/cfo-kmh-kapasite.test.ts
      - run: node --import tsx __tests__/cfo-revenue.test.ts
      - run: node --import tsx __tests__/fm-goal-kaynak.test.ts
      - run: node --import tsx __tests__/cfo-net-sermaye.test.ts
      - run: node --import tsx __tests__/cfo-documents.test.ts
      - run: node --import tsx __tests__/cfo-metrik-borc.test.ts
      - run: node --import tsx __tests__/fx-strategic.test.ts
      - run: node --import tsx __tests__/cfo-ownership.test.ts
      - run: node --import tsx __tests__/rbac-write-paths.test.ts
      - run: node --import tsx __tests__/cfo-governance-drift.test.ts
      - run: node --import tsx __tests__/cfo-alarm-whatsapp.test.ts
      - run: node --import tsx __tests__/cfo-payment-digest.test.ts
      - run: node --import tsx __tests__/cfo-engine-unknown.test.ts
      - run: node --import tsx __tests__/fm-memory-schema.test.ts
      - run: node --import tsx __tests__/fm-sales-backfill.test.ts
      - run: node --import tsx __tests__/fm-tcmb-fx.test.ts
      - run: node --import tsx __tests__/fm-fx-monthly.test.ts
      - run: node --import tsx __tests__/fx-current.test.ts
      - run: node --import tsx __tests__/cfo-capital-efficiency.test.ts
      - run: node --import tsx __tests__/cfo-voi.test.ts
      - run: node --import tsx __tests__/cfo-decision-memory.test.ts
      - run: node --import tsx __tests__/cfo-decision-measure.test.ts
      - run: node --import tsx __tests__/cfo-goal-attribution.test.ts
      - run: node --import tsx __tests__/cfo-revenue-levers.test.ts
      - run: node --import tsx __tests__/cfo-downside.test.ts
      - run: node --import tsx __tests__/cfo-card-cost.test.ts
      - run: node --import tsx __tests__/fm-stock-balance.test.ts
      - run: node --import tsx __tests__/fm-stock-adjustment.test.ts
      - run: node --import tsx __tests__/fm-goal-engine.test.ts
      - run: node --conditions=react-server --import tsx __tests__/xml-sync-fm-refresh.test.ts
      - run: node --import tsx __tests__/cfo-kargo-tarife.test.ts
      - run: node --import tsx __tests__/migration-clean-apply.test.ts
      - run: node --import tsx __tests__/schema-baseline.test.ts
      - run: node --import tsx __tests__/migrate-deploy-guard.test.ts
      - run: node --import tsx __tests__/security-anon-lockdown.test.ts
      - run: node --import tsx __tests__/cfo-files-private-migration.test.ts
      - run: node --import tsx __tests__/cfo-google-lockdown.test.ts
      - run: node --import tsx __tests__/security-defense-in-depth.test.ts
      - run: node --import tsx __tests__/security-definer-views.test.ts
      - run: node --import tsx __tests__/ai-cfo-acceptance-profile.test.ts
      - run: node --import tsx __tests__/ai-cfo-anomalies.test.ts
      - run: node --import tsx __tests__/ai-cfo-findings.test.ts
      - run: node --conditions=react-server --import tsx __tests__/ai-cfo-runner.test.ts
      - run: node --conditions=react-server --import tsx __tests__/ai-cfo-health.test.ts
      - run: node --conditions=react-server --import tsx __tests__/ai-cfo-context-blocks.test.ts
      - run: node --import tsx __tests__/ai-cfo-bank-rollforward.test.ts
      - run: node --conditions=react-server --import tsx __tests__/ai-cfo-store.test.ts
      - run: node --import tsx __tests__/ai-cfo-migration-security.test.ts
      - run: node --import tsx __tests__/ai-cfo-runner-route.test.ts
      - run: node --conditions=react-server --import tsx __tests__/ai-cfo-access.test.ts
      - run: node --conditions=react-server --import tsx __tests__/ai-cfo-source-mapping.test.ts
      - run: node --import tsx __tests__/cfo-tahsilat-tahmini.test.ts
      - run: node --import tsx __tests__/cfo-engine-forecast.test.ts
      - run: node --import tsx __tests__/forecast-backtest.test.ts
      - run: node --import tsx __tests__/forecast-backtest-sql.test.ts
      - run: node --import tsx __tests__/forecast-candidates.test.ts
      - run: node --import tsx __tests__/forecast-v2.test.ts
      - run: node --import tsx __tests__/forecast-shadow.test.ts
      - run: node --import tsx __tests__/forecast-consumers.test.ts
      - run: node --import tsx __tests__/market-scout-core.test.ts
      - run: node --import tsx __tests__/market-safe-fetch.test.ts
      - run: node --import tsx __tests__/market-scout-db.test.ts
      - run: node --import tsx __tests__/cfo-operating-context.test.ts
      - run: node --import tsx __tests__/cfo-workflow.test.ts
      - run: node --import tsx __tests__/cfo-cycle-agenda.test.ts
      - run: node --import tsx __tests__/cfo-import-planner.test.ts
      - run: node --import tsx __tests__/cfo-question-research.test.ts
      - name: Exercise CFO cycle through real Prisma and PostgreSQL
        env:
          DIRECT_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/cfo_workflow_test_ci
          CFO_WORKFLOW_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/cfo_workflow_test_ci
        run: |
          python - <<'PY'
          from pathlib import Path
          # The unrelated embedding column is never read by CFO. Its fixture
          # representation avoids needing the pgvector extension in this service.
          schema = Path('prisma/schema.prisma').read_text()
          Path('/tmp/cfo-workflow-synthetic.prisma').write_text(schema.replace('Unsupported("vector(512)")', 'String'))
          PY
          npx prisma db push --schema /tmp/cfo-workflow-synthetic.prisma
          node --conditions=react-server --import tsx __tests__/cfo-workflow-postgres.test.ts
          node --conditions=react-server --import tsx __tests__/cfo-cost-answer.test.ts
      - run: node --import tsx __tests__/cfo-private-files.test.ts
      - run: npm run check:rbac
      - run: npm run check:entegra
      - run: npm run check:banka
      - run: npm run check:banka:safety
      - run: npm run check:banka:pdf
      - run: npm run check:banka:review
      - run: npx eslint lib/banka components/banka app/api/admin/banka-yukleme __tests__/banka*.test.ts 'app/(app)/admin/banka-yukleme/page.tsx'
      - run: npx eslint lib/cfo-agent app/api/admin/ai-cfo/acceptance app/api/admin/ai-cfo/runner app/api/cron/ai-cfo-monitor 'app/(app)/admin/ai-cfo' app/api/cron/xml-sync app/api/cron/trendyol-sync app/api/admin/ai-cfo/context app/api/admin/ai-cfo/cycle app/api/cron/cfo-cycle 'app/(app)/cfo/calisan' __tests__/cfo-workflow.test.ts __tests__/cfo-import-planner.test.ts lib/actions/cfo-row-qa.ts lib/actions/cfo-question-actions.ts lib/cfo/row-qa.ts lib/cfo/question*.ts components/cfo/row-qa-panel.tsx 'app/(app)/cfo/sorular/page.tsx' __tests__/cfo-question-research.test.ts 'app/(app)/cfo/kazananlar' __tests__/cfo-private-files.test.ts __tests__/cfo-operating-context.test.ts scripts/cfo-read-context.ts __tests__/ai-cfo*.test.ts lib/forecast scripts/forecast-backtest.ts __tests__/forecast-*.ts components/forecast 'app/(app)/admin/forecast-v2' lib/market scripts/market __tests__/market-*.ts lib/actions/market-scout-actions.ts 'app/(app)/admin/market-scout' 'app/(app)/cfo/page.tsx' 'app/(app)/admin/sermaye' lib/capital lib/fx __tests__/fx-current.test.ts lib/cfo/capital-efficiency.ts lib/cfo/capital-efficiency-data.ts __tests__/cfo-capital-efficiency.test.ts 'app/(app)/cfo/sermaye' lib/cfo/voi.ts lib/cfo/voi-data.ts __tests__/cfo-voi.test.ts lib/cfo/decision-memory.ts lib/cfo/decision-memory-data.ts __tests__/cfo-decision-memory.test.ts 'app/(app)/cfo/kararlar' lib/cfo/goal-attribution.ts lib/cfo/goal-attribution-data.ts __tests__/cfo-goal-attribution.test.ts lib/cfo/revenue-levers.ts lib/cfo/revenue-levers-data.ts __tests__/cfo-revenue-levers.test.ts lib/cfo/downside.ts lib/cfo/downside-data.ts __tests__/cfo-downside.test.ts services/dashboard-service.ts 'app/(app)/cfo/calisma-durumu/page.tsx' __tests__/cfo-cost-answer.test.ts lib/cfo/card-cost.ts __tests__/cfo-card-cost.test.ts lib/cfo/cost-derivation.ts lib/cfo/cost-derivation-data.ts __tests__/cfo-cost-derivation.test.ts lib/importer-cost.ts __tests__/cfo-tek-nakit-yolu.test.ts lib/cfo-agent/reviewed-sources.ts lib/cfo/payment-capacity.ts lib/cfo/commission-estimate.ts __tests__/cfo-commission-estimate.test.ts 'app/(app)/cfo/belgeler/page.tsx' 'app/(app)/cfo/odemeler/page.tsx' __tests__/cfo-kur-tek-kaynak.test.ts lib/cfo/engine.ts lib/cfo/queries.ts 'app/(app)/cfo/gumruk/page.tsx' 'app/(app)/cfo/ayarlar/page.tsx' lib/cfo/revenue.ts __tests__/cfo-revenue.test.ts 'app/(app)/admin/sermaye/operations.tsx' 'app/(app)/cfo/kazananlar/import-planner.tsx' lib/cfo/decision-measure-job.ts lib/actions/cfo-hamle-actions.ts __tests__/cfo-decision-measure.test.ts lib/cfo-agent/decision-memory-evidence.ts __tests__/cfo-sanal-stok.test.ts lib/cfo-agent/savepoint-source.ts app/api/cron/cfo-engine __tests__/vercel-crons.test.ts __tests__/cfo-page-parity.test.ts 'app/(app)/cfo/olu-stok/page.tsx' 'app/(app)/admin/yeni-urunler/[sku]/page.tsx' __tests__/cfo-kmh-kapasite.test.ts lib/cfo-agent/health.ts
      - name: Generate ephemeral build-only session key
        run: |
          python - <<'PY'
          import os, secrets
          key = secrets.token_hex(32)
          print(f'::add-mask::{key}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'SESSION_SECRET={key}\n')
          PY
      - run: npm run build
      - run: node scripts/check-cfo-acceptance-route.mjs
      - run: node scripts/check-bank-upload-route.mjs
