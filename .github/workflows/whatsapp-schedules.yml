name: WhatsApp zamanlanmış mesajlar

# Vercel Hobby planı yalnızca GÜNLÜK cron'a izin veriyor ve iki günlük cron
# (xml-sync, trendyol-sync) zaten dolu. Zamanlanmış WhatsApp mesajları ise gün
# içinde saat başı kontrol edilmeli: bir görev 08:30'da, bir başkası 17:00'de
# olabilir. Bu yüzden tetikleme vercel.json'da DEĞİL, burada — PDKS
# hatırlatmalarıyla aynı yol (bkz. pdks-reminders.yml).
#
# SAAT BAŞI ÇAĞRILMAK SORUN DEĞİL: mükerrer freni sunucuda, `lastRunOn` yerel
# gün damgası (lib/whatsapp/schedule.ts). Görev günde EN FAZLA bir kez gönderilir.
# Aynı sebeple bir çağrı kaçarsa görev o gün içinde yine gider.
#
# ⚠️ GÜN BOYU çalışır, mesai saatlerine DARALTILMADI. PDKS hatırlatmaları
# 06:00–19:59 ile sınırlı çünkü mesai dışında anlamı yok. Burada öyle değil:
# saat 21:00'e kurulmuş bir görev, o saatte çağrı yapılmazsa ertesi sabaha
# kayar ve yanlış günde gider. Saatte bir çağrı ~10 saniye sürüyor.
#
# GEREKLİ REPO SECRET'LARI (Settings → Secrets and variables → Actions):
#   • CRON_SECRET     : Vercel'deki CRON_SECRET ile AYNI değer
#   • SITE_BASE_URL   : https://iotomasyon.com  (yoksa PDKS_BASE_URL kullanılır)
#
# PDKS_BASE_URL zaten tanımlıysa YENİ SECRET EKLEMEK GEREKMEZ — aynı sitenin
# taban adresi, yalnız adı PDKS'ye özel kalmış. SITE_BASE_URL ileride o adı
# düzeltmek için var; ikisi de yoksa job sessizce atlar (kırmızı yanmaz).
#
# ⚠️ Zamanlanmış workflow yalnız VARSAYILAN DAL'da (main) çalışır — bu dosya
# merge edilene kadar otomatik tetiklenmez.
# ⚠️ GitHub 60 gün hareketsiz kalan repolarda zamanlanmış workflow'ları devre
# dışı bırakır. Repo aktif olduğu sürece sorun yok.

on:
  schedule:
    - cron: "0 * * * *" # her saat başı, UTC (gün boyu — yukarıdaki nota bak)
  workflow_dispatch: {} # elle de tetiklenebilir (kurulum testi için)

# Gecikmeli tetikler üst üste binmesin; aynı anda tek çalışsın.
concurrency:
  group: whatsapp-schedules
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Zamanlanmış mesaj uç noktasını çağır
        env:
          BASE_URL: ${{ secrets.SITE_BASE_URL || secrets.PDKS_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_BASE_URL/PDKS_BASE_URL veya CRON_SECRET tanımlı değil; atlanıyor."
            exit 0
          fi
          # -L: 308/301 yönlendirmeyi takip et (ör. .vercel.app → iotomasyon.com).
          # --location-trusted: yönlendirme sonrası Authorization başlığını KORU;
          # yoksa Bearer düşer ve uç 401 verir (her iki host da bize ait).
          code=$(curl -sS -m 120 -L --location-trusted -o /tmp/out.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL%/}/api/cron/whatsapp-schedules")
          echo "HTTP ${code}"
          cat /tmp/out.txt || true
          echo
          # 401 → CRON_SECRET uyuşmuyor, 503 → Vercel'de CRON_SECRET yok.
          # İkisi de job'ı KIRMIZI yakar; sessizce durmasın.
          test "$code" = "200"
