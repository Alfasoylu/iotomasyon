name: CFO alarm WhatsApp denemesi

# Yalnız elle (Actions → "CFO alarm WhatsApp denemesi" → Run workflow). /api/cron/cfo-alarm-test onaylı cfo_alarm şablonuyla
# CFO_ALARM_WHATSAPP_TO alıcısına "DENEME — gerçek alarm değil" mesajı yollar; alarm üretmez, veritabanına yazmaz.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deneme mesajı gönder
        env:
          BASE_URL: ${{ secrets.SITE_BASE_URL || secrets.PDKS_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "::error::SITE_BASE_URL/PDKS_BASE_URL veya CRON_SECRET tanımlı değil"; exit 1; fi
          code=$(curl -sS -m 60 -L --location-trusted -o /tmp/out.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL%/}/api/cron/cfo-alarm-test") || code="000"
          echo "HTTP ${code}"
          cat /tmp/out.txt || true
          echo
          test "$code" = "200"
