name: PDKS geç-kalma hatırlatması

# Vercel Hobby planı 5 dk'lık cron'a izin vermediğinden, PDKS geç-kalma
# bildirimlerini bu workflow tetikler. /api/pdks/cron/reminders uç noktasını
# CRON_SECRET ile çağırır; sunucu hangi personele bildirim gideceğine karar verir.
#
# ÖNEMLİ:
# - Zamanlanmış (schedule) workflow yalnızca VARSAYILAN DAL'da (main) çalışır;
#   bu PR main'e merge edilene kadar otomatik tetiklenmez.
# - Gerekli repo secret'ları (Settings → Secrets and variables → Actions):
#     • CRON_SECRET    : Vercel'deki CRON_SECRET ile AYNI değer
#     • PDKS_BASE_URL  : production taban URL (örn. https://iotomasyon.vercel.app)
# - Saat penceresi TR mesai saatlerine (≈ 06:00–19:59) daraltıldı; minutes
#   tasarrufu için. Daha geniş istiyorsanız cron'u değiştirin.
# - GitHub cron best-effort'tur; yoğunlukta birkaç dakika gecikebilir.

on:
  schedule:
    - cron: "*/5 3-16 * * *" # UTC; ≈ TR 06:00–19:59
  workflow_dispatch: {} # elle de tetiklenebilir

# Aynı anda tek çalışsın; gecikmeli tetikler üst üste binmesin.
concurrency:
  group: pdks-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hatırlatma uç noktasını çağır
        env:
          BASE_URL: ${{ secrets.PDKS_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "PDKS_BASE_URL veya CRON_SECRET secret'ı tanımlı değil; atlanıyor."
            exit 0
          fi
          code=$(curl -sS -m 60 -o /tmp/out.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL%/}/api/pdks/cron/reminders")
          echo "HTTP ${code}"
          cat /tmp/out.txt || true
          echo
          test "$code" = "200"
