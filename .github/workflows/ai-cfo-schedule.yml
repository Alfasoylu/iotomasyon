name: CFO motoru (saatlik) + sağlık alarmı

# Deterministik CFO motoru (2026-10-08 mimari kararı: sitede LLM yok). Her saat :05 UTC:
#   1) /api/cron/ai-cfo-monitor — motor: ölç → tespit et → şablonla bulgu yaz → önemli değişiklik bayrağı → METRIK → alarm
#      (cfo_run 'engine:%'; Cowork CFO cfo_gun_ozeti görünümünü okur, 08:00 + 16:49 TR). Model çağrısı YOK, maliyet 0 TL.
#   2) /api/cron/ai-cfo-health — motor arızası, YENİ alarm ya da 09:00 TR hatırlatmasında 503 → iş KIRMIZI → GitHub e-postası.
#      Süregelen alarm (ör. taban delinmiş) saatte bir e-posta üretmez; cfo_gun_ozeti'nde görünür.
# Senkron sonrası koşular ayrıca vercel.json xml-sync (05:00 TR) ve trendyol-sync (09:00 TR) after() içinde (ayrı idempotency anahtarı).
# Vercel Hobby yeni cron slotu vermediği için GitHub Actions (birkaç dk gecikebilir). Tek iş: dakika yuvarlaması bir kez ödenir.
# Gerekli repo secret'ları: CRON_SECRET + SITE_BASE_URL (yoksa PDKS_BASE_URL). ⚠️ Zamanlanmış workflow yalnız varsayılan dalda (main) çalışır.

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ai-cfo-schedule
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Deterministik CFO motorunu çalıştır
        env:
          BASE_URL: ${{ secrets.SITE_BASE_URL || secrets.PDKS_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_BASE_URL/PDKS_BASE_URL veya CRON_SECRET tanımlı değil; atlanıyor."
            exit 0
          fi
          code=$(curl -sS -m 310 -L --location-trusted -o /tmp/out.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL%/}/api/cron/ai-cfo-monitor") || code="000"
          echo "HTTP ${code}"
          cat /tmp/out.txt || true
          echo
          # Motor hatası burada işi düşürmez: sağlık adımı arızayı (üst üste 2 başarısız / 6 saat) kendi kuralıyla bildirir.
          if [ "$code" != "200" ]; then echo "::warning::Motor koşusu HTTP ${code}"; fi
      - name: Sağlık alarmı
        env:
          BASE_URL: ${{ secrets.SITE_BASE_URL || secrets.PDKS_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then exit 0; fi
          code=$(curl -sS -m 60 -L --location-trusted -o /tmp/health.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL%/}/api/cron/ai-cfo-health")
          echo "HTTP ${code}"
          cat /tmp/health.txt || true
          echo
          if [ "$code" = "503" ]; then echo "::error::CFO alarmı — ayrıntı yukarıda"; fi
          test "$code" = "200"
